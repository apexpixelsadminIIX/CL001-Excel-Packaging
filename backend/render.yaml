# Render Blueprint for the FastAPI backend.
# In Render: New + > Blueprint, point it at this repo (root dir: backend).
services:
  - type: web
    name: excel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/content
    envVars:
      - key: MONGO_URL
        sync: false            # paste your MongoDB Atlas connection string
      - key: DB_NAME
        value: excel_packaging
      - key: CORS_ORIGINS
        sync: false            # e.g. https://www.your-domain.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
